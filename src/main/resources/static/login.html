<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizCoding - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .auth-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-container">
        <h2 class="text-center mb-4">Login</h2>
        <div id="message" class="alert" style="display:none;"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3">No account? <a href="register.html">Register here</a></p>
        <p class="text-center"><a href="index.html">Back to Home</a></p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            msg.className = 'alert alert-success';
            msg.innerText = 'Login successful! Redirecting...';
            msg.style.display = 'block';
            setTimeout(() => window.location.href = 'index.html', 1000);
        } else {
            const errorText = await response.text();
            msg.className = 'alert alert-danger';
            msg.innerText = errorText;
            msg.style.display = 'block';
        }
    } catch (error) {
        msg.className = 'alert alert-danger';
        msg.innerText = 'Connection error. Please try again.';
        msg.style.display = 'block';
    }
});
</script>
</body>
</html>
